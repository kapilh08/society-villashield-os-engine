<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VillaShield OS - Access Terminal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #F7FAFC; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); width: 100%; max-width: 400px; box-sizing: border-box; }
        h1 { color: #1A365D; font-size: 24px; text-align: center; margin: 0; }
        label { display: block; margin: 15px 0 6px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: 6px; box-sizing: border-box; font-size: 16px; background: #F8FAFC; }
        button { width: 100%; background: #2C5282; color: white; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; margin-top: 25px; cursor: pointer; }
        .links-group { text-align: center; margin-top: 20px; font-size: 14px; }
        .links-group a { color: #2B6CB0; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛡️ VillaShield OS</h1>
        <p style="text-align: center; color: #718096; margin-top: 5px;">Society Security Panel</p>
        <form action="/login-action" method="POST">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Enter username">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">
            <button type="submit">Log In Safely</button>
        </form>
        <div class="links-group">
            <p>New to the Society? <a href="/register">Create Account Now</a></p>
        </div>
    </div>
</body>
</html>
